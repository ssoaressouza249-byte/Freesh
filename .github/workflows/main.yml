name: Build REFHESS V300 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descompactando $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_extract
            if [ -f "temp_extract/build.gradle.kts" ] || [ -f "temp_extract/settings.gradle.kts" ]; then
              cp -rf temp_extract/* .
            else
              SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -rf "$SUBDIR"/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Auto-fix package names and clean template extras
        run: |
          rm -rf app/src/androidTest app/src/test
          find app/src/main -type f \( -name "*.kt" -o -name "*.xml" \) -exec sed -i 's/com\.example/com.raylan.refhessv300/g' {} +
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/com\.example/com.raylan.refhessv300/g' app/build.gradle.kts
            sed -i '/com.google.gms.google-services/d' app/build.gradle.kts
            sed -i '/com.google.android.libraries.mapsplatform.secrets-gradle-plugin/d' app/build.gradle.kts
            sed -i '/signingConfig = signingConfigs.getByName("debug")/d' app/build.gradle.kts
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' app/build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' app/build.gradle.kts
          fi
          if [ -f "build.gradle.kts" ]; then
            sed -i '/com.google.gms.google-services/d' build.gradle.kts
            sed -i '/com.google.android.libraries.mapsplatform.secrets-gradle-plugin/d' build.gradle.kts
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: REFHESS-V300-debug
          path: app/build/outputs/apk/debug/*.apk
          
